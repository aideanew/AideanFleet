# OpenCode（OpenAI 兼容代理协议：可通过 OPENAI_BASE_URL/OPENAI_API_KEY 接模型池）
name: opencode
detect: ["opencode", "--version"]
auth_check: ["opencode", "auth", "list"]
invoke: ["opencode", "run", "--format", "json"]
prompt_via: stdin
model_protocol: openai
model_flag: "-m"
output_parser: opencode_json
timeout_idle_s: 180
login: ["opencode", "auth", "login"]
