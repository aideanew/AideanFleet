# Codex CLI（OpenAI 协议：可注入 OPENAI_BASE_URL/OPENAI_API_KEY 接模型池）
name: codex
detect: ["codex", "--version"]
auth_check: ["codex", "login", "status"]
invoke: ["codex", "exec", "--json", "--skip-git-repo-check", "-s", "workspace-write"]
prompt_via: stdin
model_protocol: openai
model_flag: "-m"
output_parser: codex_jsonl
timeout_idle_s: 180
login: ["codex", "login"]
