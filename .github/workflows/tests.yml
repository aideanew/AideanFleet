name: "Fleet 测试与打包"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Guard（契约一致 + 迁移同步 + 全量测试）
      run: |
        python scripts/sync_migrations.py
        python scripts/contracts_gen.py --check
        python scripts/sync_migrations.py --check
        python -m pytest tests --tb=short -q
      shell: bash

  frontend:
    name: "构建控制台前端"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & build frontend
        working-directory: fleet/console/web
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Verify dist landed at fleet/console/dist
        run: test -f fleet/console/dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: fleet/console/dist/
          retention-days: 14

  wheel:
    name: "构建 wheel（含前端 dist）"
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: fleet/console/dist/

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/sync_migrations.py
          python scripts/sync_migrations.py --check
          python -m build --wheel
          python -m pip install dist/*.whl
          python -c "from importlib.resources import files; p = files('fleet.console').joinpath('dist/index.html'); assert p.is_file(), 'wheel 缺少前端 dist'"
          python -c "from importlib.resources import files; assert files('fleet.kernel').joinpath('_migrations/002_goal_requirements_plan_decision.sql').is_file(), 'wheel 缺迁移 SQL'; assert files('fleet.setup').joinpath('_manifest.json').is_file(), 'wheel 缺 setup manifest'"
          echo "wheel 校验通过：dist 已打进包内"

      - uses: actions/upload-artifact@v4
        with:
          name: aideanfleet-wheel
          path: dist/*.whl
          retention-days: 30
