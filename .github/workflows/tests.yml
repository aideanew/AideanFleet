name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Run tests
      id: pytest
      run: |
        python -m pytest tests -x --tb=long -v 2>&1 | tee pytest_output.txt
      shell: bash
      continue-on-error: true

    - name: Extract failure summary
      if: steps.pytest.outcome == 'failure'
      run: |
        echo "=== FAILED TEST ==="
        grep -E "^FAILED|^ERROR|::.*FAILED|::.*ERROR" pytest_output.txt | head -5
        echo "=== ERROR LINES ==="
        grep -E "^E |^Error|^ImportError|^ModuleNotFound|assert|Exception|raise" pytest_output.txt | head -20
        echo "=== LAST 30 LINES ==="
        tail -30 pytest_output.txt
      shell: bash

    - name: Print as annotation
      if: steps.pytest.outcome == 'failure'
      run: |
        {
          echo "::error::FAILED on ${{ matrix.os }}:"
          grep -E "^FAILED|^ERROR" pytest_output.txt | head -5
          echo "---"
          grep -E "^E " pytest_output.txt | head -15
          echo "---"
          tail -10 pytest_output.txt
        } | while IFS= read -r line; do
          echo "::error::$line"
        done
      shell: bash

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
      shell: bash

    - name: Upload test output on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-output-${{ matrix.os }}
        path: pytest_output.txt
