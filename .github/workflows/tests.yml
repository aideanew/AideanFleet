name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run failing test with full traceback
      id: pytest
      run: |
        python -m pytest tests/core/test_scheduler.py::test_run_loop_step_mode_survives_dispatch_exception --tb=long -v -s 2>&1 | tee pytest_output.txt
      continue-on-error: true

    - name: Upload output via GitHub API
      if: always()
      run: |
        CONTENT=$(base64 -w 0 pytest_output.txt)
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/ci_output.txt" \
          -d "{\"message\":\"CI debug output for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"
      shell: bash

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
