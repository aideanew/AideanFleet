name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Run tests
      id: pytest
      run: |
        python -m pytest tests --tb=short -v 2>&1 | tee pytest_output.txt
      shell: bash
      continue-on-error: true

    - name: Upload failure output
      if: steps.pytest.outcome == 'failure'
      run: |
        # Extract failure lines + last 30 lines
        grep -E "FAILED|Error|error|assert|Traceback" pytest_output.txt > failure_info.txt 2>/dev/null || true
        echo "=== Last 30 lines ===" >> failure_info.txt
        tail -30 pytest_output.txt >> failure_info.txt
        CONTENT=$(base64 -w 0 failure_info.txt)
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/ci_windows_failure.txt" \
          -d "{\"message\":\"CI Windows failure for ${{ matrix.os }}\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"
      shell: bash

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
