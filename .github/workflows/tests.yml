name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Debug info
      run: |
        echo "=== Python version ==="
        python --version
        echo "=== Installed packages ==="
        pip list
        echo "=== sys.path ==="
        python -c "import sys; print('\n'.join(sys.path))"
        echo "=== Try import fleet ==="
        python -c "import fleet; print('fleet OK:', fleet.__file__)" 2>&1 || echo "fleet import FAILED"
        echo "=== Try import stubs ==="
        python -c "from tests.core.stubs import pass_route; print('stubs OK')" 2>&1 || echo "stubs import FAILED"
      shell: bash

    - name: Run tests
      run: |
        python -m pytest tests -q --tb=long 2>&1 | tee pytest_output.txt
      shell: bash

    - name: Upload test output on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-output-${{ matrix.os }}
        path: pytest_output.txt
