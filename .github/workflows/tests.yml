name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Run tests
      id: pytest
      run: |
        python -m pytest tests --tb=long -v 2>&1 | tee pytest_output.txt
      shell: bash
      continue-on-error: true

    - name: Push output to ci-debug branch
      if: always()
      run: |
        git config user.name "CI"
        git config user.email "ci@localhost"
        git checkout --orphan ci-debug
        git rm -rf .
        cp pytest_output.txt .
        git add pytest_output.txt
        git commit -m "CI test output for ${{ github.sha }}"
        git push origin ci-debug --force
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
      shell: bash
