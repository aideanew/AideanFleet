name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run full test suite
      id: pytest
      run: |
        python -m pytest tests -s --tb=long -v 2>&1 | tee pytest_output.txt
      continue-on-error: true

    - name: Extract debug info and upload
      if: always()
      run: |
        # Extract only the debug lines and failure context
        grep -E "DEBUG|FAILED|AssertionError|assert|PASSED.*test_scheduler|ERROR" pytest_output.txt > debug_info.txt 2>/dev/null || true
        echo "=== Last 50 lines ===" >> debug_info.txt
        tail -50 pytest_output.txt >> debug_info.txt

        CONTENT=$(base64 -w 0 debug_info.txt)
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/ci_debug.txt" \
          -d "{\"message\":\"CI debug info for ${{ github.sha }}\",\"content\":\"$CONTENT\",\"branch\":\"main\"}"
      shell: bash

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
