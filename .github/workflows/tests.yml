name: "Fleet 测试"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
      shell: bash

    - name: Run tests
      id: pytest
      run: |
        python -m pytest tests --tb=long -v 2>&1 | tee pytest_output.txt
        echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
      shell: bash
      continue-on-error: true

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-output-${{ matrix.os }}
        path: pytest_output.txt

    - name: Fail job if tests failed
      if: steps.pytest.outcome == 'failure'
      run: exit 1
      shell: bash
